name: build

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - name: Install helpers
        run: apk add --no-cache nodejs git zip

      - uses: actions/checkout@v4

      - name: Build
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"
          make clean && make

      - name: Work out the version
        run: |
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "VERSION=latest" >> "$GITHUB_ENV"
          fi

      - name: Package (EBOOT.PBP + data/)
        run: |
          export PSPDEV=/usr/local/pspdev
          export PATH="$PSPDEV/bin:$PATH"
          make dist
          {
            echo "MCPSP $VERSION"
            echo "commit:  $GITHUB_SHA"
            echo "built:   $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > build/version.txt
          mv build MCPSP
          zip -r "MCPSP-$VERSION.zip" MCPSP

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCPSP-${{ env.VERSION }}
          path: MCPSP-${{ env.VERSION }}.zip
      - name: Move "latest" tag
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git tag -f latest
          git push -f origin latest

      - name: Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: MCPSP-${{ env.VERSION }}.zip
          target_commitish: ${{ github.sha }}
          tag_name: ${{ env.VERSION }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
